problem:
  eyebrow: The problem
  heading: The full story is there. It takes *more than one year* to read it.
  body:
    - >-
      A single year of financial statements is a snapshot. To get a fuller picture you need multiple years,
      read as a series. The spreadsheet is the natural tool for that work — and it will surface only what it
      was designed to surface, and nothing more.
    - >-
      A structured, comprehensive analysis reveals a more complete picture: performance trends, risk
      indicators, growth capacity, capital structure dynamics, and industry comparisons. Ledgerline Benchmark exists
      for that purpose — less noise, more signal.

capabilities:
  eyebrow: The depth of the analysis
  heading: Five levels, built sequentially from raw data to a *complete picture*.
  intro: Once your data is entered or imported, Ledgerline Benchmark does the heavy lifting — and the methodology is explained throughout, so the analysis stands on its own.
  items:
    - kicker: Level 01 · Earnings, cash flow & working capital
      title: The measures the statements don't show directly.
      body:
        - >-
          Free cash flow to equity and invested capital, an earnings summary from net income through EBITDA,
          net and operating working capital, and complete cash flow statements — the measures that reveal
          whether the business generates real economic value, not just accounting income.
      screen: { kind: statements, app: benchmark, label: Earnings & cash flow }
      alt: Ledgerline Benchmark setup information screen with company and industry detail
      caption: Setup — company profile, NAICS and SIC classification
    - kicker: Level 02 · Ratio analysis
      title: Over 80 ratios across eight categories.
      body:
        - Every ratio is explained in context, so readers understand what it measures and why it matters.
      bullets:
        - Revenues & margins · Profitability · Operating efficiency
        - Working capital · Liquidity · Debt coverage
        - Leverage & capitalization · Returns on total employment costs
      figure: { value: '80+', label: 'business ratios' }
    - kicker: Level 03 · Common-size statements
      title: Vertical, horizontal, and multi-year — on every line item.
      body:
        - Vertical analysis tracks relationships between line items; horizontal analysis tracks the direction and pace of change; multi-year summaries surface trends in margins, cost structure, and composition.
    - kicker: Level 04 · Advanced models
      title: Four models that reach where ratios can't.
      body:
        - Each addresses a dimension of performance standard ratio analysis doesn't answer.
      bullets:
        - Sustainable Growth — can profitability fund the growth rate?
        - DuPont ROE — margins, asset utilization, or leverage?
        - Altman Z-Score — credit stability and distress risk
        - Employee Metrics & ROI — returns on investment in people
    - kicker: Level 05 · Industry benchmarking
      title: A direct comparison to peers.
      body:
        - Compare against Industry Outlook Reports and Peer Ratio Studies , separately and as a combined average — or enter benchmark data manually from any source.

questions:
  heading: The questions that matter. *The analysis to answer them.*
  intro: A Ledgerline Benchmark analysis puts these — and many more — on the table.
  items:
    - Is the business growing, or just getting bigger?
    - It shows a profit — but how much is available for reinvestment or distribution?
    - Where is cash actually being generated, and where is it going?
    - Is working capital keeping pace with the demands placed on it?
    - Can this business finance its own growth, or will it need outside capital?
    - Is financial strength improving over time, or quietly eroding?
    - Are there early warning signals of stress that deserve attention now?
    - How does this business compare to what its peers are actually doing?

steps:
  eyebrow: Practitioner Edition
  heading: When the statements don't reflect what the business is actually doing.
  intro: >-
    For privately held businesses, owner compensation, personal expenses, non-recurring items, and
    related-party transactions distort the picture. The Practitioner Edition adds normalization.
  items:
    - title: Line-by-line adjustments
      body: Adjust any line item in the income statement or balance sheet, with a note documenting the rationale for each.
    - title: No manual propagation
      body: Adjustments flow through the full five-level analysis automatically — historic and adjusted run side by side.
    - title: Two professional reports
      body: A Financial Analysis Report and an Adjusted Financial Analysis Report, both editable in Word.

audience:
  eyebrow: Who uses Ledgerline Benchmark
  heading: One analytical system for the analysts whose work *informs decisions*.
  items:
