faqs:
  - q: How do I get my financial data into Ledgerline Benchmark?
    a: Enter data directly or import from a spreadsheet. Import requires mapping accounts to Ledgerline Benchmark's chart of accounts so calculations work correctly — a deliberate choice that keeps the analysis consistent.
  - q: Can multiple people in my firm use it?
    a: Ledgerline Benchmark is licensed to named users. Multi-user subscriptions cover up to 5 users for Standard; contact us for Practitioner Edition multi-user pricing. Analysis files can be shared with other active subscribers.
  - q: What's the difference between Industry Outlook and Peer Ratio?
    a: Peer Ratio Studies is an annual subscription covering all industries, searchable inside Ledgerline Benchmark. Industry Outlook 5-year reports are bought individually or in packs. Call us and we'll help you pick.
  - q: Does it run on Mac?
    a: Ledgerline Benchmark runs on Windows 10 or later. Mac users can run it with Parallels or a similar emulator.

closing:
  heading: Spreadsheets demand your time *before they give you anything*.
  body: Ledgerline Benchmark starts delivering from the moment your data is in.

