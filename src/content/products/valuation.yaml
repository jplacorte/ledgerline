  heading: Built for valuations that have to *hold up*.
  items:
    - title: Tax & estate
      body: Estate and gift tax, charitable contributions, and property tax — where documentation carries weight with the IRS and courts.
    - title: Litigation & disputes
      body: Shareholder disputes, dissenting interests, marital dissolution, and damages — where an opposing expert will test your conclusion.
    - title: Planning & advisory
      body: Buy-sell agreements, exit planning, ownership transition, and what a business is worth.
    - title: Corporate & financial decisions
      body: Sale, merger, divestiture, financing, recapitalization, and ESOP feasibility and ongoing valuations.
