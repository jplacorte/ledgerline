faqs:
  - q: I already do valuations in spreadsheets. Why switch?
    a: Ledgerline Valuation can replace your spreadsheet workflow or supplement it. Look at what it does across normalization, projections, the three approaches, and the report builder, and decide whether it belongs alongside or in place of what you use today.
  - q: How difficult is it to get my financial data in?
    a: Enter data directly or import from a spreadsheet. Import requires aligning accounts with Ledgerline Valuation's chart of accounts so the analytical formulas work correctly — a deliberate choice that keeps outputs reliable. Support can walk you through it before you buy.
  - q: Does Ledgerline Valuation make the decisions for me?
    a: No. Ledgerline Valuation provides structure, calculations, and documented methodology. You decide which methods to apply, how to weight them, and what the numbers mean. Every calculation is traceable.
  - q: Will it handle my kind of engagement?
    a: Ledgerline Valuation is built around Revenue Ruling 59-60, USPAP, and SSVS — the standards that govern estate and gift tax, litigation, ESOP, buy-sell, and advisory engagements.

closing:
  heading: The judgement, as always, *is yours*.
  body: Think of Ledgerline Valuation the way an architect thinks of CAD — not something that makes the professional decisions, but the environment that keeps every element connected so you can focus on the judgements that form a supportable conclusion.

