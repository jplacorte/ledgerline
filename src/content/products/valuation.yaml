problem:
  eyebrow: The problem
  heading: Valuation demands judgement. The tool should *amplify it*, not distract.
  body:
    - >-
      Revenue Ruling 59-60 requires judgement, not a formula. What it doesn't account for is how much of
      that judgement gets crowded out by the mechanics of the tool — building workbooks, chasing broken
      formulas, and rebuilding the report in Word when the analysis is done.
    - >-
      The costlier distraction is cognitive. Instead of asking "Is this the right discount rate?" or "Which
      methods deserve the greatest weight?", the tool forces "Why doesn't this total tie?" and "Which version
      of this file is current?" Ledgerline Valuation handles the mechanics so your bandwidth goes back to the judgement calls.
  compare:
    without:
      - Why doesn't this total tie?
      - Which cell reference drives this number?
      - Did I overwrite that formula?
      - Which version of this file is current?
    with:
      - Is this the right discount rate?
      - Does management's projection make sense?
      - Are these adjustments economically justified?
      - Which methods deserve the greatest weight?

capabilities:
  eyebrow: The engagement, in four stages
  heading: Each stage builds on the last — *foundation to report*.
  intro: The analytical foundation informs the methods. The indications inform the conclusion. The conclusion is what the report documents.
  items:
    - kicker: Stage 01 · Analytical foundation
      title: Organize, normalize, analyze, and project.
      body:
        - >-
          Up to ten years of history plus interim and trailing-twelve-month data. Line-by-line normalization on
          both the income statement and balance sheet, each adjustment documented with a note.
        - >-
          Ratios, common-size, cash flow, working capital, DuPont ROE, sustainable growth, and Altman Z-Score —
          benchmarked against Industry Outlook or Peer Ratio. Projections run up to ten years, with two years of monthly
          detail.
      screen: { kind: statements, app: valuation }
      alt: Ledgerline Valuation historic income statements with normalization adjustments
      caption: Normalization adjustments across every period
    - kicker: Stage 02 · Indications of value
      title: Income, market, and asset approaches — all reaching enterprise equity value.
      body:
        - Every indication reaches the same level of value before reconciliation, so they can be meaningfully compared.
      bullets:
        - Capitalization of earnings, excess earnings, DCF, and discounted future earnings
        - Build-up, CAPM, and iterated WACC rate development
        - Main Street Comps, Deal Index, and guideline public companies
        - Net asset value and liquidation value with a dedicated intangibles screen
      screen: { kind: setup, app: valuation, preset: rates }
      alt: Ledgerline Valuation discount and capitalization rate options for the income approach
      caption: Rate development for the income approach
    - kicker: Stage 03 · Conclusion of value
      title: Weight the indications, test the value, resolve to the shareholder level.
      body:
        - >-
          Assign weights with payback, ROI, R-squared, and coefficient of variation to inform each choice. A
          test of value checks whether a hypothetical buyer could finance the deal at your conclusion. Then
          apply DLOM, DLOC, or control premiums in the correct sequence, down to value per share.
      screen: { kind: weights, app: valuation }
      alt: Ledgerline Valuation Enterprise Equity Value conclusion screen with weighted indications
      caption: Weighted indications become your conclusion
    - kicker: Stage 04 · The report
      title: Your methodology. Your conclusions. Your fully editable report.
      body:
        - >-
          A context-sensitive report that assembles only the sections your engagement used — structured around
          USPAP, SSVS, and Revenue Ruling 59-60 for valuation engagements, and SSVS for calculation engagements.
          Fully editable in Word, with prompts that guide your narrative and never appear in the delivered document.
      alt: Standards-based valuation report open in Microsoft Word
      caption: Report builder output, fully editable in Word

steps:
  eyebrow: The Guardrails advantage
  heading: Discipline built into the platform, not left to memory.
  intro: Structural assists that handle the tracking work a spreadsheet leaves entirely to the practitioner.
  items:
    - title: Income approach discipline
      body: Ledgerline Valuation enforces the match between benefit stream and discount or capitalization rate. If they don't correspond, a conversion adjustment is required before the method produces an indication.
    - title: Market multiple integrity
      body: Price multiples are calculated from the financial data you enter, not quoted from the data source — because quoted multiples from transaction databases aren't always correct.
    - title: Equity value conversion
      body: Every Market Value of Invested Capital indication is converted to equity by deducting debt and preferred stock, consistently, for every method.

audience:
