problem:
  eyebrow: The problem
  heading: The numbers have to work together. *They usually don't.*
  body:
    - >-
      When an acquisition lands on your desk, you're still the CFO. The monthly close doesn't move. And now
      there's a transaction on top of it: How much should we pay? What does the deal need to look like to
      work? What does this business become under our ownership?
    - >-
      Most buyers start with a spreadsheet for the financials, another for the valuation, something for the
      structure, a separate model for projections. When a diligence finding touches revenue, it ripples
      through valuation, structure, financing, and returns — across disconnected files. Sometimes it never
      gets traced at all. That's not a spreadsheet problem. It's a focus problem. Ledgerline Deals resolves it by
      connecting the work.
  compare:
    without:
      - A spreadsheet for financials, another for valuation, another for projections
      - Change one assumption, update files manually
      - Tracing a ripple across disconnected files takes hours
      - Built from scratch every time a new deal arrives
    with:
      - One system covering every stage of the deal
      - One change updates everything in real time
      - Valuation, structure, financing, and returns always connected
      - The analytical framework is already built

capabilities:
  eyebrow: What Ledgerline Deals covers
  heading: One integrated system, guiding the *full acquisition*.
  intro: Five stages, fourteen capabilities — from the first candidate you screen to the financial blueprint that documents whether the deal works under your ownership.
  items:
    - kicker: Stage 01 · Screening & foundation
      title: Triage candidates and build the baseline before you price anything.
      body:
        - >-
          Define your acquisition criteria — hurdle rate, strategic fit, financial thresholds, deal size — then
          screen candidates on summary data with preliminary ROI under Buy/Sell and Buy/Hold scenarios.
        - >-
          Enter up to ten years of historical statements plus interim and TTM, map each normalization
          adjustment to a specific line item, and analyze 81 ratios, common-size, DuPont ROE, Altman Z-Score,
          and sustainable growth.
      screen: { kind: dashboard, app: deals, label: Screening — price & ROI }
      alt: Ledgerline Deals screening screen with price and ROI estimates
      caption: Screening — a go/no-go read before the full commitment
    - kicker: Stage 02 · Valuation & pricing
      title: Establish fair market value, then translate it into a defensible maximum price.
      body:
        - >-
          Income, market, and asset approaches under Revenue Ruling 59-60, USPAP, and SSVS. The Guideline
          Pricing Tool then solves for the maximum price you can pay under multiple scenarios, with IRR,
          payback, NPV, and investment turns updating in real time.
      screen: { kind: statements, app: deals }
      alt: Ledgerline Deals historic income statements with recast adjustments
      caption: Detailed financials and recast adjustments
    - kicker: Stage 03 · Structure & financing
      title: Build the purchase price package and the full capital stack that funds it.
      body:
        - >-
          Stock or assets; cash, notes, non-competes, earnouts, and assumed liabilities. Then senior and junior
          debt, seller financing, mezzanine with equity kickers, revolvers, and common, preferred, and
          convertible equity — with funding and working capital monitors updating as you go.
      screen: { kind: capital, app: deals }
      alt: Ledgerline Deals debt funding and capital structure screen
      caption: Capital stack — senior debt, mezzanine, and seller financing
    - kicker: Stage 04 · Post-acquisition blueprint
      title: Project what the business becomes under new ownership — and what it returns.
      body:
        - >-
          A second, fully linked set of three-statement projections built on your operating assumptions, deal
          terms, and funding. IRR for up to ten equity tranches, covenant compliance, Altman Z-Score, and
          consolidation for strategic acquirers.
      screen: { kind: ratios, app: deals, label: Ratios vs. industry }
      alt: Ledgerline Deals business ratios compared to industry norms
      caption: Ratios and industry comparison across the projection period
    - kicker: Stage 05 · Decision documents
      title: Put the analysis in front of the people who approve, fund, and live with the deal.
      body:
        - >-
          Eight fully editable Word reports — from Buy-Side Acquisition Proposal and Term Sheet to Sell-Side
          Pitchbook and Business Valuation — generated from the same assumptions that drove every decision.

steps:
  eyebrow: Deal insight
  heading: What surfaces when the model is connected.
  intro: Three moments from live deals where an integrated framework changed the conversation.
  items:
    - title: The cash cow that wasn't
      body: >-
        Pre-deal projections carried historic capex forward flat. Sustainable growth analysis flagged that
        projected revenue growth exceeded what the capital structure could support — an underinvesting growth
        company, not a cash cow. The conversation shifted from price to value creation.
    - title: The due diligence discovery
      body: >-
        Subscription revenue climbing with no matching cost increase, alongside a bump in owner distributions.
        Diligence revealed aggressively pre-sold subscriptions whose obligations would transfer to the buyer —
        and a material price adjustment.
    - title: From apprehension to agreement
      body: >-
        A seller's attorney balked at a subordinated note. The post-acquisition model showed debt service
        across every tranche and the cash available to service the note each year. The seller evaluated the
        analysis, not the buyer's optimism.

