faqs:
  - q: Does Ledgerline Deals model returns for multiple investors?
    a: Yes. It calculates IRR for each equity participant based on their share of invested capital, entry point, and target exit year — parent company, co-investors, or a management equity stake.
  - q: How is it different from building my own model in Excel?
    a: A spreadsheet gives you a blank canvas. Ledgerline Deals gives you an integrated architecture — normalization, valuation, structure, financing, two-set projections, and ROI — where every input connects to every output.
  - q: Can it handle both buy-side and sell-side work?
    a: "Yes. Buy-side: screening, deal analysis, structure, financing, and post-acquisition projections. Sell-side: pre-market analysis, normalized earnings, valuation for pricing strategy, and a Selling Pitchbook or CIM."
  - q: Does it integrate with third-party data?
    a: Optionally. Peer Ratio Studies and Industry Outlook for benchmarking; Main Street Comps and Deal Index for transaction comparables. Third-party transaction data can be imported from Excel.
  - q: Should I wait until I have a deal before buying?
    a: Almost always no. The worst time to learn a new analytical system is under deal pressure. The buyers and advisors who use Ledgerline Deals best have it running before the deal arrives.
  - q: What happens to my files if my subscription expires?
    a: Ledgerline Deals stops running, but your files stay intact on your machine. Before expiry you can export analysis files to Excel. Renewing at $995/year restores full access.

closing:
  heading: Stop rebuilding the model every time.
  body: Every deal you evaluate without an integrated framework costs you time at the start and leverage at the table.

