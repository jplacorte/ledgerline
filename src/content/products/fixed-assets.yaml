capabilities:
  eyebrow: See it work
  heading: The accounting and depreciation capability your organization *actually needs*.
  intro: >-
    No limit on the number of assets you track. No limit on the number of companies or entities you manage.
    One system for your fixed asset accounting and management.
  items:
    - kicker: Depreciation
      title: Calculate depreciation correctly across up to six books at once.
      body:
        - >-
          Financial (GAAP), tax, AMT, ACE, state, and other — from a single set of inputs. 81 methods
          cover the full range of US tax and financial reporting, with half-year, mid-month, and
          mid-quarter conventions applied correctly per asset, plus bonus depreciation and Section 179.
        - >-
          Each book is independent: the same asset can carry a different cost, method, life, convention,
          business-use percentage, and Section 179 treatment per book. Luxury auto limits and listed
          property rules are applied, so vehicle depreciation is never overcalculated.
      figure: { value: '81', label: 'depreciation methods' }
      screen: { kind: books, app: assets }
      alt: Multi-book screen with depreciation variables for six sets of books
      caption: Multi-book — set depreciation variables for up to six books
    - kicker: Standard report library
      title: The reports your auditors, tax preparer, and leadership need — ready before they ask.
      body:
        - >-
          Monthly and annual depreciation, acquisitions, disposals, gain and loss, journal entries, net book
          value, rollforward, projections, CIP, Form 4562, Form 4797, AMT, personal property tax, UBIA for
          Section 199A, and more.
        - Every report runs with options for book, period, sorting, subtotals, and filters — and exports to Excel, PDF, or Word in one step.
      figure: { value: '24', label: 'built-in reports' }
      screen: { kind: report, app: assets }
      alt: Report library print preview of a depreciation report
      caption: Report library — print preview of a standard depreciation report
    - kicker: Flex View
      title: Your asset data, organized exactly the way you want to see it.
      body:
        - >-
          A dynamic, searchable, sortable grid with your entire asset list at your fingertips. Choose the
          fields, add subtotals, sort and filter in seconds. Over 30 preset views ship out of the box; create
          as many custom views as your work requires.
        - Every view exports to Excel in one step — the fastest way to build a custom report without writing a formula.
      figure: { value: '30+', label: 'preset views, unlimited custom' }
      screen: { kind: grid, app: assets }
      alt: Flex View grid with grouping, subtotals, and filters applied
      caption: Flex View — sortable, filterable, exportable
    - kicker: Accounting classification
      title: Set it up right once. Calculations, entries, and reports follow.
      body:
        - Assign each asset its structure and the right calculations, journal entries, and reports follow automatically.
      bullets:
        - Group/category, location, and department
        - GL accounts for assets, expense, accumulated depreciation, and CIP
        - Tax class, useful life, and method — MACRS, ACRS, bonus, Section 179
        - Half-year, mid-quarter, mid-month, or full-month convention
        - 15 user-defined fields — 5 each for text, date, and numeric
      screen: { kind: setup, app: assets, preset: asset, label: General asset data }
      alt: General Asset Data screen with classification and tax detail
      caption: General asset data — identification and tax detail
    - kicker: Beyond the schedule
      title: Track every asset you own, whether you depreciate it or not.
      body:
        - >-
          Land doesn't depreciate. Assets below your capitalization threshold get expensed. Track them all in
          the same system, with the same structure — and they flow into the personal property tax report, so
          your filing reflects everything you own.
        - >-
          Assets acquired under capital or finance leases are tracked and depreciated at their capitalized
          value. Ledgerline Assets is not a lease accounting solution.
      screen: { kind: setup, app: assets, preset: control }
      alt: Asset Control screen with custodian, location, and warranty detail
      caption: Asset control — custodian, condition, warranty, and attachments

steps:
  eyebrow: The asset lifecycle
  heading: From the day an asset enters your books to the day it leaves.
  intro: >-
    Fixed assets don't just sit on a balance sheet. They're acquired, sometimes built from scratch, managed
    through their useful life, and eventually disposed.
  items:
    - title: Construction in progress
      body: >-
        Track capital project costs from the first invoice through completion, then convert the project
        into one or more capitalized assets ready to depreciate.
    - title: Physical asset management
      body: >-
        Custodian, location, and condition for inventories; warranty and service coverage; and a file
        cabinet for invoices, purchase orders, and images attached to each asset record.
    - title: Disposals
      body: >-
        Calculate gain or loss and generate journal entries across every book. Dispose of a group at once, or
        split an asset into a disposed part and a remaining part that keeps depreciating.
    - title: Getting your data in
      body: >-
        The Data Import Wizard and an included Excel template bring your records across. A 30-minute
        one-on-one onboarding session and a 15-video Quick Start library handle the rest.

