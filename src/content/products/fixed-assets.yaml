faqs:
  - q: How many assets and companies can I track?
    a: There's no preset limit. Single and Site licenses both include unlimited assets and unlimited companies or entities, each with their own complete records. Ledgerline Assets does not consolidate across entities.
  - q: Does it support both tax and GAAP depreciation?
    a: Yes. It calculates depreciation across up to six books simultaneously — financial (GAAP), tax, AMT, ACE, state, and others — independently configured per asset, from a single set of inputs.
  - q: Can I import my existing asset data?
    a: Yes. The Data Import Wizard guides you through importing from Excel, and an included template shows you exactly how to prepare your data. Asset templates and a quick-add form speed up manual entry.
  - q: Does Ledgerline Assets connect to my accounting system?
    a: It's a standalone system. It generates journal entries you post into your accounting system, keeping you in control of what hits your general ledger. There's no direct sync with accounting platforms.
  - q: What does the annual renewal include?
    a: A new version each January reflecting current tax law changes and program improvements, plus continued US-based support. Single License renewal is $249; Site License renewal is $349.
  - q: What systems does it run on?
    a: Windows 11 and 10, 32- and 64-bit. Mac users can run it with Parallels or a similar emulator. Site License deployments support RDS, Terminal Server, and Citrix.

